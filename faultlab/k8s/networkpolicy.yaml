# FAULT (network/no-network-policy): the faultlab namespace has NO NetworkPolicy, so every pod can
# talk to every other pod (and to Postgres) and nothing restricts ingress from other namespaces.
# FIX: apply the default-deny below, then allow proxy->services, services->postgres, and DNS egress.
#
# Note: this file intentionally renders to nothing. kustomize needs a resource, so a harmless
# ConfigMap marker is emitted instead; the real policy is the commented block.
#
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: default-deny-all
# spec:
#   podSelector: {}
#   policyTypes: ["Ingress", "Egress"]
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-dns-egress
# spec:
#   podSelector: {}
#   policyTypes: ["Egress"]
#   egress:
#     - to:
#         - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
#       ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-proxy-to-services
# spec:
#   podSelector:
#     matchExpressions: [{ key: app, operator: In, values: [catalog-service, order-service] }]
#   policyTypes: ["Ingress"]
#   ingress:
#     - from: [{ podSelector: { matchLabels: { app: proxy } } }]
#       ports: [{ port: 8080 }]
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-services-to-postgres
# spec:
#   podSelector: { matchLabels: { app: postgres } }
#   policyTypes: ["Ingress"]
#   ingress:
#     - from:
#         - podSelector: { matchLabels: { app: catalog-service } }
#         - podSelector: { matchLabels: { app: order-service } }
#       ports: [{ port: 5432 }]
apiVersion: v1
kind: ConfigMap
metadata:
  name: faultlab-networkpolicy-marker
data:
  note: "No NetworkPolicy is applied in this namespace on purpose. See k8s/networkpolicy.yaml."
