# faultlab proxy: serves the Angular build and proxies /api/* to the Spring services.
# This file is the single source of truth: it is baked into faultlab/proxy:dev AND shipped as the
# ConfigMap `proxy-nginx-conf` (kustomize configMapGenerator) which is mounted over the baked copy.
# Every "FAULT" line has the fixed variant commented next to it.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access log. $uri deliberately excludes the query string; no cookies are logged.
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"request_id":"$request_id"}';
    access_log /dev/stdout json_combined;
    # Second copy on a shared emptyDir so the diagnostics probe sidecar can summarize it
    # (see faultlab/k8s-probe). Harmless if the directory does not exist at runtime: nginx warns once.
    access_log /var/log/nginx/access.json json_combined;

    sendfile on;
    keepalive_timeout 65;

    # FAULT (performance/no-compression): gzip is off, so the ~1 MB of JS ships uncompressed.
    gzip off;
    # FIX: gzip on; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 1024;

    # Local-only stub_status for the diagnostics probe (never exposed on the pod's service port).
    server {
        listen 127.0.0.1:8081;
        server_name _;
        access_log off;
        location = /stub_status { stub_status; }
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # FAULT (security/no-security-headers): no CSP / HSTS / X-Frame-Options / X-Content-Type-Options.
        # FIX:
        # add_header X-Content-Type-Options "nosniff" always;
        # add_header X-Frame-Options "DENY" always;
        # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

        # Real nginx health endpoint.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
        # FAULT (pod/wrong-liveness-path): the health path used to be /healthz; it was moved to
        # /nginx-health but the Deployment's livenessProbe still points at /healthz, which now 404s.
        # (Without this explicit 404 the SPA fallback below would mask the mistake with a 200.)
        # FIX: delete this block and point the probe at /nginx-health.
        location = /healthz { return 404; }

        # RUM ingest: browsers beacon to /__rum (same origin, no CORS); nginx forwards to the
        # diagnostics probe sidecar on localhost. Nothing else on the probe is reachable this way.
        location = /__rum {
            access_log off;
            client_max_body_size 16k;
            proxy_pass http://127.0.0.1:9911/rum;
            proxy_read_timeout 2s;
        }

        # ---- API routing table (see faultlab/README.md) ----
        # FAULT (performance/short-upstream-timeout): 2 s is shorter than /products/slow (3 s) and
        # /checkout (5 s), so those return 504 from the proxy while the backend keeps working.
        # FIX: proxy_read_timeout 30s;
        proxy_read_timeout 2s;
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;

        location /api/catalog/  { proxy_pass http://catalog-service:8080/; }
        location /api/orders/   { proxy_pass http://order-service:8080/orders/; }
        location = /api/cart    { proxy_pass http://order-service:8080/cart; }
        location = /api/checkout { proxy_pass http://order-service:8080/checkout; }
        location /api/admin/    { proxy_pass http://order-service:8080/admin/; }
        # Anything else under /api/ is not a route: return JSON 404 instead of the SPA shell.
        location /api/ { default_type application/json; return 404 '{"error":"no such route"}'; }

        # FAULT (performance/no-cache-headers): content-hashed Angular chunks are served with no
        # Cache-Control/Expires, so browsers revalidate them on every visit.
        # FIX:
        # location ~* \.[0-9A-Za-z]{8}\.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
        # FAULT (frontend/source-maps-shipped): *.map files are served from the same root (ng build --source-map).
        # FIX: location ~* \.map$ { return 404; }  (and build without --source-map)

        # SPA fallback.
        # FAULT (performance/index-cacheable): index.html has no "no-cache", so a cached shell can
        # reference chunk hashes that no longer exist after a deploy.
        # FIX: location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
